name: Dissonant
options:
  bundleIdPrefix: com.crackerjack.dissonant
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  DissonantCore:
    path: DissonantCore
  AudioKit:
    url: https://github.com/AudioKit/AudioKit.git
    from: "5.6.0"
  AudioKitEX:
    url: https://github.com/AudioKit/AudioKitEX.git
    from: "5.6.0"
  DunneAudioKit:
    url: https://github.com/AudioKit/DunneAudioKit.git
    from: "5.6.0"
  SoundpipeAudioKit:
    url: https://github.com/AudioKit/SoundpipeAudioKit.git
    from: "5.6.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local dev builds without a signing identity.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Dissonant:
    type: application
    platform: macOS
    sources:
      - Dissonant
    dependencies:
      - package: DissonantCore
        product: DissonantCore
      - package: AudioKit
        product: AudioKit
      - package: AudioKitEX
        product: AudioKitEX
      - package: DunneAudioKit
        product: DunneAudioKit
      - package: SoundpipeAudioKit
        product: SoundpipeAudioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crackerjack.dissonant.app
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Dissonant/Info.plist
        ENABLE_HARDENED_RUNTIME: "YES"
    info:
      path: Dissonant/Info.plist
      properties:
        CFBundleDisplayName: dissonant
        CFBundleName: dissonant
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: dissonant project
            LSHandlerRank: Owner
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - com.crackerjack.dissonant.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.crackerjack.dissonant.project
            UTTypeDescription: dissonant project
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - dissonant

  DissonantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DissonantTests
    dependencies:
      - target: Dissonant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.crackerjack.dissonant.tests
