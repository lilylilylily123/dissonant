[package]
name = "dissonant-net"
description = "Carries a Dissonant session between machines over iroh: encrypted, direct where it can be, relayed where it can't, found by a short code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iroh = "1"
iroh-mdns-address-lookup = "0.6"
argon2 = "0.5"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = { workspace = true }
log = "0.4"

[dev-dependencies]
dissonant-core = { path = "../dissonant-core" }
dissonant-session = { path = "../dissonant-session" }
