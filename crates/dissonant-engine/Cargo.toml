[package]
name = "dissonant-engine"
description = "Dissonant's audio engine: sample-accurate sequencing, synth + drum voices, mixing and rendering."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dissonant-core = { path = "../dissonant-core" }
dissonant-plugins = { path = "../dissonant-plugins" }
uuid = { workspace = true }
rtrb = "0.4"
hound = "3.5"
cpal = "0.18"
thiserror = { workspace = true }
log = "0.4"

[dev-dependencies]
# The insert tests run real CLAP effects, built from this crate's own fixture. Both sides of the
# audio-ports extension are needed: the host half comes in through `dissonant-plugins`, the
# plugin half is compiled into the `cdylib` examples below.
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["audio-ports", "clack-plugin"] }

# One source, two builds: the same saturator at two drives, so an insert chain's order is
# something a test can hear. `cargo test` builds examples, so both are on disk by the time the
# tests run.
[[example]]
name = "dissonant_saturator_boost_fixture"
path = "tests/fixture/boost_entry.rs"
crate-type = ["cdylib"]

[[example]]
name = "dissonant_saturator_trim_fixture"
path = "tests/fixture/trim_entry.rs"
crate-type = ["cdylib"]
