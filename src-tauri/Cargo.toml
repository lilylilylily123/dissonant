[package]
name = "dissonant-app"
description = "Dissonant desktop app (Tauri shell around dissonant-core and dissonant-engine)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dissonant_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dissonant-core = { path = "../crates/dissonant-core" }
dissonant-engine = { path = "../crates/dissonant-engine" }
dissonant-plugins = { path = "../crates/dissonant-plugins" }
dissonant-catalog = { path = "../crates/dissonant-catalog" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
open = "5"
dirs = "7"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
log = "0.4"
env_logger = "0.11"
midir = "0.11"
tauri-plugin-window-state = "2.5.0"
hound = "3.5"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "flac", "mp3", "pcm", "isomp4", "alac", "aac"] }
rtrb = "0.4"
# The sample fetcher's first-use yt-dlp install, the same HTTP client and hash the catalog uses.
ureq = "3"
sha2 = "0.11"
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
# Killing a cancelled fetch's whole process group, launcher and children alike.
libc = "0.2"
