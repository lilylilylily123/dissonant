[package]
name = "dissonant-app"
description = "Dissonant desktop app (Tauri shell around dissonant-core and dissonant-engine)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dissonant_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dissonant-core = { path = "../crates/dissonant-core" }
dissonant-engine = { path = "../crates/dissonant-engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
log = "0.4"
env_logger = "0.11"
midir = "0.11"
