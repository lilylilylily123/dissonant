[workspace]
resolver = "2"
members = [
    "crates/dissonant-core",
    "crates/dissonant-engine",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/lilylilylily123/dissonant"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Audio DSP in debug builds is painfully slow; keep the engine optimized even in dev.
[profile.dev.package.dissonant-engine]
opt-level = 2
